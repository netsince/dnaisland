[project]
name = "dnaisland"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-cors>=5.0.0",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "pillow>=12.3.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.10.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
# 生产 WSGI 服务器：Linux/macOS 用 gunicorn，Windows 用 waitress
# 安装： uv sync --extra prod   或   pip install ".[prod]"
prod = [
    "gunicorn>=23.0.0 ; sys_platform != 'win32'",
    "waitress>=3.0.0 ; sys_platform == 'win32'",
]
# 开发期检查工具： ruff（lint+格式化）、mypy（类型检查）、pytest（测试）
# 安装： uv sync --extra dev   或   pip install ".[dev]"
dev = [
    "ruff>=0.14.0",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# ---------------- ruff：一站式 lint + 格式化 ----------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "scripts", "migrations"]
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "migrations",          # 自动生成的迁移脚本，不纳入 lint
    "*.pyc",
]

[tool.ruff.lint]
# 启用的规则集（E 错误、F 未定义名、W 警告、I import 排序、UP 现代化写法、B 混淆写法、C4 简洁写法）
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",                # 行长度交给格式化器处理
    "B008",                # Flask 路由装饰器常触发（如 @app.route(...)）
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许未使用的 fixture/导入
"tests/*" = ["F401", "F811"]
# 路由/脚本中为避免循环导入，刻意把部分 import 放在文件中部
"app/routes/*.py" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------- mypy：静态类型检查 ----------------
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["migrations", ".venv"]

# Flask-SQLAlchemy 在运行时动态生成 `db.Model` 基类，mypy 静态无法识别，
# 属已知误报；模型文件仅用其声明表结构，故在此关闭 name-defined 以消噪。
[[tool.mypy.overrides]]
module = "app.models.*"
disable_error_code = ["name-defined"]

