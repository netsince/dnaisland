{% extends "base.html" %}

{% block title %}新建工单 · DNAISLAND{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:720px;">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('user.my_tickets') }}">我的工单</a></li>
      <li class="breadcrumb-item active">新建工单</li>
    </ol>
  </nav>

  <h1 class="h4 fw-bold mb-4">新建工单</h1>

  <form method="post" class="needs-validation" novalidate>
    <div class="mb-3">
      <label for="category" class="form-label fw-semibold">类别</label>
      <select class="form-select" id="category" name="category_id">
        <option value="">请选择类别（可选）</option>
        {% for c in categories %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="title" class="form-label fw-semibold">工单主题 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="title" name="title" required
             maxlength="120" placeholder="简要描述你的问题或建议">
    </div>

    <div class="mb-3">
      <label for="content" class="form-label fw-semibold">详细内容 <span class="text-danger">*</span></label>
      <textarea class="form-control" id="content" name="content" rows="6" required
                placeholder="请详细描述你的问题，包括相关截图、时间、操作步骤等"></textarea>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary rounded-pill px-4">
        <i class="bi bi-send me-1"></i>提交工单
      </button>
      <a href="{{ url_for('user.my_tickets') }}" class="btn btn-outline-secondary rounded-pill px-3">取消</a>
    </div>
  </form>
</div>
{% endblock %}
